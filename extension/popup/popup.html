<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snap Vanish 2.0</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <svg width="20" height="20" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <path d="M14 3.5 A 10.5 10.5 0 0 0 14 24.5 L 14 3.5 Z" fill="#f0623a" />
            <rect x="15.4" y="6.2" width="3" height="3" rx="0.6" fill="#ff8a65" />
            <rect x="15.4" y="12.2" width="3" height="3" rx="0.6" fill="#f0623a" />
            <rect x="15.2" y="18.2" width="2.6" height="2.6" rx="0.5" fill="#d2451e" />
            <circle cx="21.4" cy="10.2" r="1.3" fill="#ff9d80" opacity="0.85" />
            <circle cx="21.2" cy="16.8" r="1.2" fill="#f0623a" opacity="0.75" />
          </svg>
          <div>
            <div class="brand-name">Snap Vanish</div>
            <div class="brand-sub">v2.0 · MV3 LOCAL AI</div>
          </div>
        </div>
        <button
          type="button"
          id="master-toggle"
          role="switch"
          aria-checked="true"
          aria-label="Enable Snap Vanish"
          class="switch-btn"
        >
          <span class="switch-thumb"></span>
        </button>
      </header>

      <div class="status-strip">
        <div class="status-left">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">ARMED · READY</span>
        </div>
        <span id="platform-label" class="platform-label">Checking call…</span>
      </div>

      <main class="popup-body">
        <div class="field">
          <label for="preset-select" class="field-label">Active Effect Preset</label>
          <select id="preset-select" class="select-input">
            <option value="dust">Classic Dust (1.8s)</option>
            <option value="cinematic-disintegration">Cinematic Disintegration (2.2s)</option>
            <option value="fine-particles">Fine Particles (1.7s)</option>
            <option value="light-burst">Energy Burst (1.5s)</option>
            <option value="fade-out">Gentle Fade (1.2s)</option>
            <option value="reverse-assembly">Reverse Assembly (1.8s)</option>
          </select>
        </div>

        <div class="field">
          <div class="field-row">
            <label for="sens-range" class="field-label">Snap Sensitivity</label>
            <span id="sens-val" class="mono-val">62/100</span>
          </div>
          <input id="sens-range" type="range" min="1" max="100" value="62" />
        </div>

        <div class="toggles-grid">
          <button type="button" id="audio-toggle" class="pill-toggle" data-on="true">
            <span>Acoustic Gate</span>
            <strong id="audio-state">ON</strong>
          </button>
          <button type="button" id="lowpower-toggle" class="pill-toggle" data-on="false">
            <span>Low Power</span>
            <strong id="lowpower-state">OFF</strong>
          </button>
        </div>

        <div class="actions-row">
          <button type="button" id="btn-vanish" class="btn btn-primary">
            Test Vanish
          </button>
          <button
            type="button"
            id="btn-restore"
            class="btn btn-danger"
            title="Unconditionally restores live camera and mic (Alt+Shift+R)"
          >
            Emergency Restore
          </button>
        </div>
      </main>

      <footer class="popup-footer">
        <span class="shortcut-hint">Alt+Shift+D · Alt+Shift+R</span>
        <button type="button" id="btn-open-studio" class="link-btn">
          Studio &amp; Settings →
        </button>
      </footer>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
